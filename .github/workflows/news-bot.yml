name: Kakao News Briefing

on:
  schedule:
    # 매일 KST 06:41 = UTC 21:41 (전날). 정각을 피해야 지연/스킵이 적음
    - cron: "41 21 * * *"
  workflow_dispatch: {} # Actions 탭에서 수동 실행 버튼 (테스트용)

permissions:
  contents: write # 브리핑 파일을 저장소에 커밋하기 위해 필요

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pynacl # refresh token 자동 갱신용 (선택)

      - name: Run news bot
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python news_bot.py

      - name: Commit briefing file
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add briefings/latest.md
          git diff --cached --quiet && echo "변경 없음" || git commit -m "briefing: $(date -u +%F)"
          git push
